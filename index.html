<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNDERTALE Engine - Amber Battle</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #viewport {
            position: relative;
            width: 95vw;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
        }
        #touch-ui {
            width: 100%;
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .t-btn {
            background: #111;
            border: 2px solid #fff;
            color: #fff;
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
        }
        .t-btn:active {
            background: #ff0;
            color: #000;
        }
        .t-btn-ok {
            grid-column: span 3;
            background: #b22222;
        }
        .t-btn-ok:active {
            background: #ff4500;
            color: #fff;
        }
        #log-area {
            color: #f33;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="viewport">
    <canvas id="screen" width="640" height="480"></canvas>
    <div id="log-area"></div>
    
    <div id="touch-ui">
        <div></div>
        <div class="t-btn" id="pad-up">▲</div>
        <div></div>
        <div class="t-btn" id="pad-left">◀</div>
        <div class="t-btn" id="pad-down">▼</div>
        <div class="t-btn" id="pad-right">▶</div>
        <div class="t-btn t-btn-ok" id="pad-ok">BOUTON Z (OK)</div>
    </div>
</div>

<script>
/* ==========================================================================
   UNDERTALE ADVANCED BATTLE SYSTEM
   ========================================================================== */

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const logArea = document.getElementById('log-area');

// --- ASSET LOADER ---
const MANIFEST = {
    amberIdle: 'amber_idle.png',
    amberCombat: 'amber_combat.png',
    amberParazyte: 'amber_parazyte.png',
    amberPeace: 'amber_peace.png',
    amberAngry: 'amber_angry.png',
    amberHappy: 'amber_happy.png',
    amberStand: 'amber_stand.png',
    soul: 'red_soul.png',
    dagger: 'black_dagger.png',
    btnFight: 'fight_button.jpg',
    btnAct: 'act_button.jpg',
    btnItem: 'item_button.jpg',
    btnMercy: 'mercy_button.jpg'
};

class AssetManager {
    constructor(manifest) {
        this.manifest = manifest;
        this.images = {};
        this.loadedCount = 0;
        this.total = Object.keys(manifest).length;
    }

    loadAll(onComplete) {
        for (let key in this.manifest) {
            const img = new Image();
            img.src = this.manifest[key];
            img.onload = () => {
                this.loadedCount++;
                if (this.loadedCount === this.total) onComplete();
            };
            img.onerror = () => {
                logArea.innerHTML += "Erreur : " + this.manifest[key] + "<br>";
            };
            this.images[key] = img;
        }
    }

    get(key) {
        return this.images[key];
    }
}

// --- CLASSES ENTITÉ ---
class Soul {
    constructor() {
        this.x = 320;
        this.y = 320;
        this.size = 16;
        this.speed = 3.5;
        this.invulnerableTimer = 0;
    }

    move(inputs, box) {
        if (inputs.up && this.y > box.y + 6) this.y -= this.speed;
        if (inputs.down && this.y < box.y + box.h - this.size - 6) this.y += this.speed;
        if (inputs.left && this.x > box.x + 6) this.x -= this.speed;
        if (inputs.right && this.x < box.x + box.w - this.size - 6) this.x += this.speed;

        if (this.invulnerableTimer > 0) this.invulnerableTimer--;
    }

    draw(ctx, img) {
        if (this.invulnerableTimer % 4 < 2) {
            if (img) {
                ctx.drawImage(img, this.x, this.y, this.size, this.size);
            } else {
                ctx.fillStyle = '#f00';
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }
    }
}

class Projectile {
    constructor(x, y, vx, vy, type = 'normal') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.w = 12;
        this.h = 16;
        this.type = type;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
    }

    draw(ctx, img) {
        if (img) {
            ctx.drawImage(img, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }

    collidesWith(soul) {
        return (
            soul.x < this.x + this.w &&
            soul.x + soul.size > this.x &&
            soul.y < this.y + this.h &&
            soul.y + soul.size > this.y
        );
    }
}

class BattleBox {
    constructor() {
        this.x = 100;
        this.y = 250;
        this.w = 440;
        this.h = 140;
        this.targetW = 440;
        this.targetH = 140;
    }

    resize(w, h) {
        this.targetW = w;
        this.targetH = h;
    }

    update() {
        this.w += (this.targetW - this.w) * 0.2;
        this.h += (this.targetH - this.h) * 0.2;
        this.x = 320 - this.w / 2;
    }

    draw(ctx) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 5;
        ctx.strokeRect(this.x, this.y, this.w, this.h);
    }
}

// --- MOTEUR DE JEU PRINCIPAL ---
class Engine {
    constructor() {
        this.assets = new AssetManager(MANIFEST);
        this.soul = new Soul();
        this.box = new BattleBox();
        this.projectiles = [];
        this.inputs = { up: false, down: false, left: false, right: false };
        
        this.state = 'INTRO';
        this.btnIndex = 0;
        this.subIndex = 0;
        
        this.playerHP = 76;
        this.maxHP = 76;
        this.enemyHP = 100;
        
        this.sprite = 'amberStand';
        this.fullText = "* Amber vous barre la route.";
        this.displayText = "";
        this.charIdx = 0;
        
        this.attackBarX = 0;
        this.attackSpeed = 7;
        this.attackActive = false;
        this.bulletPatternTimer = 0;
    }

    init() {
        this.assets.loadAll(() => {
            this.bindControls();
            requestAnimationFrame((t) => this.loop(t));
        });
    }

    bindControls() {
        const bind = (id, key) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.inputs[key] = true;
                if (key === 'ok') this.handleOK();
            });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                this.inputs[key] = false;
            });
        };

        bind('pad-up', 'up');
        bind('pad-down', 'down');
        bind('pad-left', 'left');
        bind('pad-right', 'right');
        bind('pad-ok', 'ok');
    }

    handleOK() {
        if (this.state === 'INTRO') {
            this.state = 'MENU_MAIN';
        } else if (this.state === 'MENU_MAIN') {
            if (this.btnIndex === 0) {
                this.state = 'ATTACK_BAR';
                this.attackBarX = this.box.x + 10;
                this.attackActive = true;
            } else if (this.btnIndex === 1) {
                this.state = 'SUB_ACT';
            } else if (this.btnIndex === 2) {
                this.setDialogue("* Vous n'avez aucun objet.");
            } else if (this.btnIndex === 3) {
                this.sprite = 'amberPeace';
                this.setDialogue("* Vous n'avez plus envie de vous battre.");
            }
        } else if (this.state === 'SUB_ACT') {
            if (this.subIndex === 0) this.setDialogue("* Vous inspectez Amber. ATK 10 DEF 10.");
            else this.setDialogue("* Vous tentez de discuter.");
        } else if (this.state === 'ATTACK_BAR' && this.attackActive) {
            this.attackActive = false;
            let dist = Math.abs(this.attackBarX - 320);
            let dmg = Math.max(2, Math.floor(40 - dist / 8));
            this.enemyHP = Math.max(0, this.enemyHP - dmg);
            this.sprite = 'amberAngry';
            this.setDialogue("* Degats infliges : " + dmg);
        } else if (this.state === 'DIALOGUE') {
            if (this.charIdx < this.fullText.length) {
                this.displayText = this.fullText;
                this.charIdx = this.fullText.length;
            } else {
                this.startBulletHell();
            }
        }
    }

    setDialogue(txt) {
        this.fullText = txt;
        this.displayText = "";
        this.charIdx = 0;
        this.state = 'DIALOGUE';
    }

    startBulletHell() {
        this.state = 'BULLET_HELL';
        this.sprite = 'amberCombat';
        this.bulletPatternTimer = 320;
        this.projectiles = [];
        this.box.resize(200, 160);
        this.soul.x = 320 - this.soul.size / 2;
        this.soul.y = 330;
    }

    update(dt) {
        this.box.update();

        if (this.state === 'MENU_MAIN') {
            if (this.inputs.left) { this.btnIndex = (this.btnIndex + 3) % 4; this.inputs.left = false; }
            if (this.inputs.right) { this.btnIndex = (this.btnIndex + 1) % 4; this.inputs.right = false; }
        }

        if (this.state === 'SUB_ACT') {
            if (this.inputs.up || this.inputs.down) { this.subIndex = (this.subIndex === 0) ? 1 : 0; this.inputs.up = false; this.inputs.down = false; }
        }

        if (this.charIdx < this.fullText.length) {
            this.displayText += this.fullText[this.charIdx];
            this.charIdx++;
        }

        if (this.state === 'ATTACK_BAR' && this.attackActive) {
            this.attackBarX += this.attackSpeed;
            if (this.attackBarX > this.box.x + this.box.w - 10) {
                this.attackActive = false;
                this.setDialogue("* Attaque ratee !");
            }
        }

        if (this.state === 'BULLET_HELL') {
            this.soul.move(this.inputs, this.box);
            this.bulletPatternTimer--;

            // Spawn de vagues
            if (this.bulletPatternTimer % 25 === 0 && this.bulletPatternTimer > 40) {
                this.projectiles.push(new Projectile(
                    this.box.x + Math.random() * (this.box.w - 20),
                    this.box.y - 10,
                    (Math.random() - 0.5) * 1.5,
                    3
                ));
            }

            for (let i = this.projectiles.length - 1; i >= 0; i--) {
                let p = this.projectiles[i];
                p.update();

                if (p.collidesWith(this.soul) && this.soul.invulnerableTimer === 0) {
                    this.playerHP = Math.max(0, this.playerHP - 5);
                    this.soul.invulnerableTimer = 30;
                    this.projectiles.splice(i, 1);
                    continue;
                }

                if (p.y > this.box.y + this.box.h) {
                    this.projectiles.splice(i, 1);
                }
            }

            if (this.bulletPatternTimer <= 0 && this.projectiles.length === 0) {
                this.box.resize(440, 140);
                this.state = 'MENU_MAIN';
                this.sprite = 'amberStand';
                this.setDialogue("* Que allez-vous faire ?");
            }
        }
    }

    render() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Enemy
        let floatY = Math.sin(Date.now() / 300) * 5;
        let img = this.assets.get(this.sprite) || this.assets.get('amberStand');
        if (img) ctx.drawImage(img, 270, 40 + floatY, 100, 150);

        // Box
        this.box.draw(ctx);

        // UI Text
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';

        if (this.state === 'SUB_ACT') {
            ctx.fillText("* Check", this.box.x + 30, this.box.y + 40);
            ctx.fillText("* Talk", this.box.x + 30, this.box.y + 80);
            let soulY = (this.subIndex === 0) ? this.box.y + 25 : this.box.y + 65;
            ctx.drawImage(this.assets.get('soul'), this.box.x + 10, soulY, 14, 14);
        } else if (this.state === 'ATTACK_BAR') {
            ctx.fillStyle = '#333';
            ctx.fillRect(this.box.x + 10, this.box.y + 20, this.box.w - 20, this.box.h - 40);
            if (this.attackActive) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.attackBarX, this.box.y + 10, 10, this.box.h - 20);
            }
        } else if (this.state === 'BULLET_HELL') {
            this.soul.draw(ctx, this.assets.get('soul'));
            this.projectiles.forEach(p => p.draw(ctx, this.assets.get('dagger')));
        } else {
            ctx.fillText(this.displayText, this.box.x + 20, this.box.y + 40);
        }

        // Stats
        ctx.fillText("LV 19   HP", 100, 415);
        ctx.fillStyle = '#f00';
        ctx.fillRect(230, 402, 100, 16);
        ctx.fillStyle = '#ff0';
        ctx.fillRect(230, 402, (this.playerHP / this.maxHP) * 100, 16);
        ctx.fillStyle = '#fff';
        ctx.fillText(this.playerHP + " / " + this.maxHP, 345, 415);

        // Buttons
        const btns = [this.assets.get('btnFight'), this.assets.get('btnAct'), this.assets.get('btnItem'), this.assets.get('btnMercy')];
        btns.forEach((bImg, i) => {
            let x = 32 + (i * 153);
            if (bImg) ctx.drawImage(bImg, x, 432, 110, 40);
            if (this.state === 'MENU_MAIN' && this.btnIndex === i) {
                ctx.strokeStyle = '#f90';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, 432, 110, 40);
            }
        });
    }

    loop(timestamp) {
        this.update(1 / 60);
        this.render();
        requestAnimationFrame((t) => this.loop(t));
    }
}

// Start Engine
const game = new Engine();
game.init();
</script>
</body>
</html>
